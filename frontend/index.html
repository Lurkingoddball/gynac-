<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gynaec-Obs AI | DC Dutta Tutor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header Card -->
  <header class="bg-gradient-to-r from-blue-900 to-indigo-700 text-white p-5 shadow-lg">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Ask anything from Gynaec-Obs</h1>
        <p class="text-sm opacity-90 mt-0.5">Source: DC Dutta Textbook of Obstetrics & Gynecology</p>
        <span class="inline-block bg-white/20 text-xs font-semibold px-2.5 py-0.5 rounded-full mt-2">By Aryan Jadhav</span>
      </div>
      <button onclick="startNewSession()" class="bg-white/10 hover:bg-white/20 text-xs px-3 py-2 rounded-lg transition font-medium border border-white/20">
        ➕ New Session
      </button>
    </div>
  </header>

  <!-- Chat Output Container -->
  <main class="max-w-3xl w-full mx-auto p-4 flex-1 overflow-y-auto space-y-4" id="chat-box">
    <!-- Messages render here dynamically -->
  </main>

  <!-- Input Bar -->
  <footer class="bg-white border-t border-slate-200 p-4 sticky bottom-0">
    <div class="max-w-3xl mx-auto flex gap-2">
      <input type="text" id="user-input" placeholder="Ask anything from Gynaec-Obs..." 
             class="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm"
             onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl text-sm font-semibold shadow-md transition">
        Send
      </button>
    </div>
  </footer>

  <script>
    const API_BASE = "http://localhost:8000"; // Update with live backend URL post-deployment
    let sessionId = localStorage.getItem("gynac_session_id") || "sess_" + Math.random().toString(36).substring(2, 9);
    localStorage.setItem("gynac_session_id", sessionId);

    async function loadHistory() {
      try {
        const res = await fetch(`${API_BASE}/api/history/${sessionId}`);
        const data = await res.json();
        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML = "";
        data.forEach(msg => appendMessage(msg.role, msg.content));
      } catch (err) {
        console.log("No history found or server offline");
      }
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById("chat-box");
      const wrapper = document.createElement("div");
      
      if (role === "user") {
        wrapper.className = "flex justify-end";
        wrapper.innerHTML = `<div class="bg-blue-600 text-white p-3.5 rounded-2xl max-w-[85%] text-sm shadow-sm">${text}</div>`;
      } else {
        wrapper.className = "flex justify-start";
        wrapper.innerHTML = `<div class="bg-white border border-slate-200 p-4 rounded-2xl max-w-[90%] text-sm shadow-sm leading-relaxed text-slate-800">${marked.parse(text)}</div>`;
      }
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage("user", prompt);
      input.value = "";

      const chatBox = document.getElementById("chat-box");
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "flex justify-start text-xs text-slate-400 italic p-2";
      loadingDiv.innerText = "Searching DC Dutta & synthesizing response...";
      chatBox.appendChild(loadingDiv);

      try {
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, prompt: prompt })
        });
        const data = await res.json();
        chatBox.removeChild(loadingDiv);
        appendMessage("assistant", data.answer);
      } catch (err) {
        chatBox.removeChild(loadingDiv);
        appendMessage("assistant", "⚠️ Error connecting to backend server.");
      }
    }

    function startNewSession() {
      sessionId = "sess_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("gynac_session_id", sessionId);
      document.getElementById("chat-box").innerHTML = "";
    }

    loadHistory();
  </script>
</body>
</html>
